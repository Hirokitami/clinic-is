name: clinic-is

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # для подключения из DBeaver/pgAdmin: localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      CLINIC_DATABASE_URL: postgresql+psycopg://clinic:${POSTGRES_PASSWORD:-clinic}@db:5432/clinic
      CLINIC_SECRET_KEY: ${CLINIC_SECRET_KEY:-local-docker-secret-change-me-0123456789abcdef}
      CLINIC_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000" # Swagger: http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Публичный адрес через Cloudflare Quick Tunnel (без аккаунта, адрес *.trycloudflare.com меняется при перезапуске).
  # Запуск: docker compose --profile tunnel up -d   ·  адрес: docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      - frontend

volumes:
  pgdata:
